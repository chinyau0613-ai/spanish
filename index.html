<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiestaLingua - 樂學西語</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #7b1fa2 0%, #4a148c 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 520px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            color: #ffeb3b;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #e0e0e0;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .content-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            color: #ffffff;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FiestaLingua - 樂學西語</h1>
        <div class="subtitle">歡迎來到你的西班牙語學習空間</div>
        <div class="content-box">
            <p>這裡是用來存放學習筆記與網頁內容的地方。</p>
        </div>
    </div>
</body>
</html>
